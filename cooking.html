<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox" onclick="closeLight()">
  <button class="lightbox-close" onclick="closeLight()" aria-label="닫기">&times;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
</div>

<footer>
  &copy; 2024 KIM JINHYUN
</footer>

<script>
  function openLight(src) {
    var lb = document.getElementById('lightbox');
    var img = document.getElementById('lightboxImg');
    img.src = src;
    lb.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeLight() {
    var lb = document.getElementById('lightbox');
    lb.classList.add('hidden');
    document.body.style.overflow = '';
    document.getElementById('lightboxImg').src = '';
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLight();
  });
  // Stop click on image from bubbling to close
  document.getElementById('lightboxImg').addEventListener('click', function(e) {
    e.stopPropagation();
  });
</script>
