<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#DDE5A6">
  <title>오프라인 · 회기랩</title>
  <style>
    html, body { margin: 0; height: 100%; background: #DDE5A6; color: #000;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; word-break: keep-all; }
    img { width: 96px; height: 96px; border-radius: 22px; border: 2px solid #000; }
    h1 { margin: 0; font-size: 26px; font-weight: 900; }
    p { margin: 0; font-size: 15px; color: #4c5230; line-height: 1.5; }
    button { margin-top: 8px; height: 48px; padding: 0 22px; border: 2px solid #000; border-radius: 10px;
      background: #F2D80E; font-size: 16px; font-weight: 700; color: #000; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>회기랩은 인터넷이 있어야 열립니다.<br>연결되면 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
